[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-agent-router"
version = "0.1.0"
description = "Slack chatbot that routes questions via Amazon Bedrock Agent to knowledge backends"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.30,<2",
    "slack-sdk>=3.44,<4",
    "httpx>=0.28,<1",
    "aiohttp>=3.14,<4",
    # Pinned to the 1.x line: mcp 2.x is a breaking rework that renames
    # streamablehttp_client and other APIs used in backends/rovo.py.
    # Bumping to 2.x requires a code migration (see MCP SDK v2 migration guide).
    "mcp>=1.30,<2",
    "pydantic>=2.13,<3",
    "boto3>=1.43,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168,<7",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-mock>=3.16,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slack_agent_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/slack_agent_router"]
omit = ["src/slack_agent_router/models.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
