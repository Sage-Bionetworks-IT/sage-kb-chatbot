---
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bedrock Agent for the Slack Agent Router.
  Creates an agent with a RETURN_CONTROL action group
  (SearchConfluenceJira) and a live alias.

Parameters:
  AgentName:
    Type: String
    Default: slack-agent-router
    Description: Name of the Bedrock Agent.

  FoundationModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: >
      Bedrock foundation model or inference profile ID.
      Use a cross-region inference profile (us.*) for
      models that require it.

  AgentAliasName:
    Type: String
    Default: live
    Description: Name of the agent alias used by the application.

  SearchConfluenceJiraState:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Enable or disable the SearchConfluenceJira action group.

Resources:
  # -----------------------------------------------------------------
  # IAM role that the Bedrock Agent assumes
  # -----------------------------------------------------------------
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AgentName}-bedrock-agent-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: BedrockAgentModelAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                  - "arn:aws:bedrock:*::foundation-model/*"

  # -----------------------------------------------------------------
  # Bedrock Agent with SearchConfluenceJira RETURN_CONTROL action group
  # -----------------------------------------------------------------
  SlackAgentRouterAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      FoundationModel: !Ref FoundationModelId
      AutoPrepare: true
      Description: >
        Routes Slack questions to the Confluence/Jira knowledge backend
        via Rovo MCP, synthesizes answers with citations.
      Instruction: >
        You are a helpful assistant for Sage Bionetworks employees.
        When a user asks a question, use SearchConfluenceJira to search
        internal knowledge sources.

        Use SearchConfluenceJira for questions about internal processes,
        projects, policies, HR topics, IT procedures, or anything tracked
        in Confluence wiki pages or Jira issues.

        After receiving results from the tool, synthesize a single
        coherent answer. Always cite your sources by including the URLs
        returned by the tool. Format citations as a numbered list at
        the end of your answer.

        If no relevant information is found, say so clearly. Do not
        make up or hallucinate answers.

        Keep answers concise but complete. Use plain language appropriate
        for a workplace setting.

        If there is any reason to question the source, such as being
        multiple years old, say so clearly.
      IdleSessionTTLInSeconds: 3600

      ActionGroups:
        # --- SearchConfluenceJira (Rovo MCP) -----------------------
        - ActionGroupName: SearchConfluenceJira
          ActionGroupState: !Ref SearchConfluenceJiraState
          Description: >
            Search Confluence wiki pages and Jira issues via Atlassian
            Rovo to find internal documentation, policies, project
            information, and issue details.
          ActionGroupExecutor:
            CustomControl: RETURN_CONTROL
          FunctionSchema:
            Functions:
              - Name: find_content
                Description: >
                  Search Confluence and Jira content for information
                  relevant to the user's question. Returns matching
                  documents with summaries and source URLs.
                Parameters:
                  query:
                    Type: string
                    Description: >
                      The search query to find relevant Confluence
                      pages and Jira issues.
                    Required: true

  # -----------------------------------------------------------------
  # Agent alias (points to the latest prepared version)
  # -----------------------------------------------------------------
  SlackAgentRouterAlias:
    Type: AWS::Bedrock::AgentAlias
    DependsOn: SlackAgentRouterAgent
    Properties:
      AgentId: !GetAtt SlackAgentRouterAgent.AgentId
      AgentAliasName: !Ref AgentAliasName
      Description: !Sub "Alias for ${AgentName} using ${FoundationModelId}"

Outputs:
  AgentId:
    Description: Bedrock Agent ID (set as BEDROCK_AGENT_ID env var)
    Value: !GetAtt SlackAgentRouterAgent.AgentId

  AgentAliasId:
    Description: Bedrock Agent Alias ID (set as BEDROCK_AGENT_ALIAS_ID env var)
    Value: !GetAtt SlackAgentRouterAlias.AgentAliasId

  AgentArn:
    Description: Full ARN of the Bedrock Agent
    Value: !GetAtt SlackAgentRouterAgent.AgentArn

  AgentRoleArn:
    Description: IAM role ARN assumed by the Bedrock Agent
    Value: !GetAtt BedrockAgentRole.Arn
